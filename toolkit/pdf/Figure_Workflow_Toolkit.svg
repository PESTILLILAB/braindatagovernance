<?xml version="1.0" encoding="UTF-8"?>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e5f"></path></marker>
 <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5cab"></path></marker>
</defs>
<text x="60" y="46" font-size="26" font-weight="700" fill="#1d2230">Governance workflow for AI-ready neurodata</text><text x="60" y="74" font-size="15" fill="#5a6273">Inputs: object · parties · origin, hosting and access jurisdictions · purpose · recipient type · participant status</text><rect x="60" y="96" width="26" height="14" rx="3" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="92" y="108" font-size="13" fill="#5a6273">decision or action</text><rect x="246" y="96" width="26" height="14" rx="3" fill="#dfeaf0" stroke="#1f4e5f" stroke-width="1.4"></rect><text x="278" y="108" font-size="13" fill="#5a6273">tier, outcome or action</text><line x1="467" y1="103" x2="497" y2="103" stroke="#7a5cab" stroke-width="2" stroke-dasharray="6 4"></line><text x="503" y="108" font-size="13" fill="#5a6273">loop between tools</text><rect x="60" y="150" width="400" height="620" rx="10" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"></rect><rect x="60" y="150" width="400" height="64" rx="10" fill="#dfeaf0"></rect><rect x="60" y="190" width="400" height="24" fill="#dfeaf0"></rect><text x="76" y="178" font-size="19" font-weight="700" fill="#1d2230">1  Classify the object</text><text x="76" y="200" font-size="13" fill="#5a6273">Neurodata Governance Decision Tool</text><rect x="76" y="234" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="94" y="263" font-size="14" font-weight="700" fill="#1d2230">0B</text><text x="146" y="256" font-size="13" fill="#1d2230">Participant status (minors, incapacity,</text><text x="146" y="271" font-size="13" fill="#1d2230">deceased, community)</text><rect x="76" y="288" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="94" y="317" font-size="14" font-weight="700" fill="#1d2230">2A</text><text x="146" y="310" font-size="13" fill="#1d2230">Object is itself a model or persistent</text><text x="146" y="325" font-size="13" fill="#1d2230">artefact?</text><rect x="76" y="342" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="94" y="371" font-size="14" font-weight="700" fill="#1d2230">4</text><text x="146" y="364" font-size="13" fill="#1d2230">Derivative with excess inferential</text><text x="146" y="379" font-size="13" fill="#1d2230">capacity?</text><rect x="76" y="396" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="94" y="425" font-size="14" font-weight="700" fill="#1d2230">5</text><text x="146" y="425" font-size="13" fill="#1d2230">Direct identifiers or identifying anatomy?</text><rect x="76" y="450" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="94" y="479" font-size="14" font-weight="700" fill="#1d2230">6</text><text x="146" y="479" font-size="13" fill="#1d2230">Linkage key available to the recipient?</text><rect x="76" y="504" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="94" y="533" font-size="14" font-weight="700" fill="#1d2230">8</text><text x="146" y="526" font-size="13" fill="#1d2230">Disclosure risk for the intended</text><text x="146" y="541" font-size="13" fill="#1d2230">recipient?</text><path d="M260,558 L260,574" stroke="#1f4e5f" stroke-width="1.8" marker-end="url(#ar)"></path><rect x="76" y="580" width="368" height="160" rx="6" fill="#dfeaf0" stroke="#1f4e5f" stroke-width="1.4"></rect><text x="88" y="596" font-size="11" font-weight="700" fill="#5a6273" letter-spacing="1">TIER (HIGHEST GOVERNS)</text><text x="90" y="614" font-size="13" font-weight="600" fill="#1d2230">Tier 5  model-associated</text><text x="90" y="638" font-size="13" font-weight="600" fill="#1d2230">Tier 4  revealing derivative</text><text x="90" y="662" font-size="13" font-weight="600" fill="#1d2230">Tier 3  directly identifiable</text><text x="90" y="686" font-size="13" font-weight="600" fill="#1d2230">Tier 2  linkable by recipient</text><rect x="84" y="695" width="352" height="21" rx="4" fill="#fff" stroke="#c9cfd6" stroke-width="1"></rect><text x="90" y="710" font-size="13" font-weight="600" fill="#1d2230">Tier 1b  participant-level, non-linkable</text><text x="90" y="734" font-size="13" font-weight="600" fill="#1d2230">Tier 1  aggregate</text><text x="76" y="756" font-size="12" fill="#5a6273">Records to: Schedule B</text><rect x="486" y="150" width="400" height="620" rx="10" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"></rect><rect x="486" y="150" width="400" height="64" rx="10" fill="#dfeaf0"></rect><rect x="486" y="190" width="400" height="24" fill="#dfeaf0"></rect><text x="502" y="178" font-size="19" font-weight="700" fill="#1d2230">2  Assess the pathway</text><text x="502" y="200" font-size="13" fill="#5a6273">Neurodata Transfer and Access Decision Tool</text><rect x="502" y="234" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="520" y="263" font-size="14" font-weight="700" fill="#1d2230">3</text><text x="572" y="256" font-size="13" fill="#1d2230">Recipients: named · public release (gated)</text><text x="572" y="271" font-size="13" fill="#1d2230">· unknown</text><rect x="502" y="288" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="520" y="317" font-size="14" font-weight="700" fill="#1d2230">6A</text><text x="572" y="310" font-size="13" fill="#1d2230">Matrix class A1–E → mechanism, default</text><text x="572" y="325" font-size="13" fill="#1d2230">outcome</text><rect x="502" y="342" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="520" y="371" font-size="14" font-weight="700" fill="#1d2230">6B</text><text x="572" y="364" font-size="13" fill="#1d2230">Prohibition · localisation · authorisation</text><text x="572" y="379" font-size="13" fill="#1d2230">· sanctions · permit</text><rect x="502" y="396" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="520" y="425" font-size="14" font-weight="700" fill="#1d2230">7</text><text x="572" y="418" font-size="13" fill="#1d2230">Exporter mechanism (i) · importer basis</text><text x="572" y="433" font-size="13" fill="#1d2230">(ii) · permit (7A)</text><rect x="502" y="450" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="520" y="479" font-size="14" font-weight="700" fill="#1d2230">9 / 10</text><text x="572" y="479" font-size="13" fill="#1d2230">Linkage? → Tool 1   ·   AI use? → Tool 3</text><rect x="502" y="504" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="520" y="533" font-size="14" font-weight="700" fill="#1d2230">11–13</text><text x="572" y="526" font-size="13" fill="#1d2230">Purpose · onward sharing · safeguards</text><text x="572" y="541" font-size="13" fill="#1d2230">implemented</text><path d="M686,558 L686,574" stroke="#1f4e5f" stroke-width="1.8" marker-end="url(#ar)"></path><rect x="502" y="580" width="368" height="112" rx="6" fill="#dfeaf0" stroke="#1f4e5f" stroke-width="1.4"></rect><text x="514" y="596" font-size="11" font-weight="700" fill="#5a6273" letter-spacing="1">OUTCOME</text><text x="516" y="614" font-size="13" font-weight="600" fill="#1d2230">1  Proceed</text><text x="516" y="638" font-size="13" font-weight="600" fill="#1d2230">2  Proceed after safeguards</text><text x="516" y="662" font-size="13" font-weight="600" fill="#1d2230">3  Redesign the pathway</text><text x="516" y="686" font-size="13" font-weight="600" fill="#1d2230">4  Do not proceed</text><text x="502" y="756" font-size="12" fill="#5a6273">Records to: Schedule C</text><rect x="912" y="150" width="400" height="620" rx="10" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"></rect><rect x="912" y="150" width="400" height="64" rx="10" fill="#dfeaf0"></rect><rect x="912" y="190" width="400" height="24" fill="#dfeaf0"></rect><text x="928" y="178" font-size="19" font-weight="700" fill="#1d2230">3  Reassess the transformation</text><text x="928" y="200" font-size="13" fill="#5a6273">Derivative and Embedding Governance Decision Tool</text><rect x="928" y="234" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="946" y="263" font-size="14" font-weight="700" fill="#1d2230">4</text><text x="998" y="263" font-size="13" fill="#1d2230">Identifies or re-links a participant?</text><rect x="928" y="288" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="946" y="317" font-size="14" font-weight="700" fill="#1d2230">5</text><text x="998" y="310" font-size="13" fill="#1d2230">Inference or profiling capability? →</text><text x="998" y="325" font-size="13" fill="#1d2230">candidate Tier 4</text><rect x="928" y="342" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="946" y="371" font-size="14" font-weight="700" fill="#1d2230">6</text><text x="998" y="364" font-size="13" fill="#1d2230">Computational persistence? → candidate</text><text x="998" y="379" font-size="13" fill="#1d2230">Tier 5</text><rect x="928" y="396" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="946" y="425" font-size="14" font-weight="700" fill="#1d2230">7</text><text x="998" y="418" font-size="13" fill="#1d2230">Leakage and anonymity assessment (release</text><text x="998" y="433" font-size="13" fill="#1d2230">gate)</text><rect x="928" y="450" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="946" y="479" font-size="14" font-weight="700" fill="#1d2230">8–9A</text><text x="998" y="472" font-size="13" fill="#1d2230">Provenance · deployment · release</text><text x="998" y="487" font-size="13" fill="#1d2230">conditions</text><rect x="928" y="504" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="946" y="533" font-size="14" font-weight="700" fill="#1d2230">10–11</text><text x="998" y="526" font-size="13" fill="#1d2230">Retention, unlearning · exposure</text><text x="998" y="541" font-size="13" fill="#1d2230">manageable?</text><path d="M1112,558 L1112,574" stroke="#1f4e5f" stroke-width="1.8" marker-end="url(#ar)"></path><rect x="928" y="580" width="368" height="136" rx="6" fill="#dfeaf0" stroke="#1f4e5f" stroke-width="1.4"></rect><text x="940" y="596" font-size="11" font-weight="700" fill="#5a6273" letter-spacing="1">OUTCOME</text><text x="942" y="614" font-size="13" font-weight="600" fill="#1d2230">1  Retain tier</text><text x="942" y="638" font-size="13" font-weight="600" fill="#1d2230">2  Refer Tier 4</text><text x="942" y="662" font-size="13" font-weight="600" fill="#1d2230">3  Confirm Tier 5</text><text x="942" y="686" font-size="13" font-weight="600" fill="#1d2230">4  Specialist review</text><text x="942" y="710" font-size="13" font-weight="600" fill="#1d2230">5  Do not proceed</text><text x="928" y="756" font-size="12" fill="#5a6273">Records to: Schedule D</text><rect x="1338" y="150" width="400" height="620" rx="10" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"></rect><rect x="1338" y="150" width="400" height="64" rx="10" fill="#dfeaf0"></rect><rect x="1338" y="190" width="400" height="24" fill="#dfeaf0"></rect><text x="1354" y="178" font-size="19" font-weight="700" fill="#1d2230">4  Select contract modules</text><text x="1354" y="200" font-size="13" fill="#5a6273">MDTAA Clause Selection Tool</text><rect x="1354" y="234" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="1372" y="263" font-size="14" font-weight="700" fill="#1d2230">2</text><text x="1424" y="256" font-size="13" fill="#1d2230">Cross-border + transfer-instrument module</text><text x="1424" y="271" font-size="13" fill="#1d2230">for origin regime</text><rect x="1354" y="288" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="1372" y="317" font-size="14" font-weight="700" fill="#1d2230">3–4</text><text x="1424" y="310" font-size="13" fill="#1d2230">Supplementary safeguards · enhanced</text><text x="1424" y="325" font-size="13" fill="#1d2230">protection (Tier 3–5)</text><rect x="1354" y="342" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="1372" y="371" font-size="14" font-weight="700" fill="#1d2230">5–7</text><text x="1424" y="364" font-size="13" fill="#1d2230">Derivative · AI and model · controlled</text><text x="1424" y="379" font-size="13" fill="#1d2230">access</text><rect x="1354" y="396" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="1372" y="425" font-size="14" font-weight="700" fill="#1d2230">8–13</text><text x="1424" y="418" font-size="13" fill="#1d2230">Onward transfer · commercial / research ·</text><text x="1424" y="433" font-size="13" fill="#1d2230">linkage · inference</text><rect x="1354" y="450" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="1372" y="479" font-size="14" font-weight="700" fill="#1d2230">14–16</text><text x="1424" y="472" font-size="13" fill="#1d2230">Audit · return and deletion · persistent</text><text x="1424" y="487" font-size="13" fill="#1d2230">artefacts</text><rect x="1354" y="504" width="368" height="46" rx="23" fill="#fff" stroke="#c9cfd6" stroke-width="1.4"></rect><text x="1372" y="533" font-size="14" font-weight="700" fill="#1d2230">17–20</text><text x="1424" y="526" font-size="13" fill="#1d2230">Community · benefit sharing · coordination</text><text x="1424" y="541" font-size="13" fill="#1d2230">· law and forum</text><path d="M1538,558 L1538,574" stroke="#1f4e5f" stroke-width="1.8" marker-end="url(#ar)"></path><rect x="1354" y="580" width="368" height="88" rx="6" fill="#dfeaf0" stroke="#1f4e5f" stroke-width="1.4"></rect><text x="1366" y="596" font-size="11" font-weight="700" fill="#5a6273" letter-spacing="1">IMPLEMENTATION</text><text x="1368" y="614" font-size="13" font-weight="600" fill="#1d2230">Compile and check consistency</text><text x="1368" y="638" font-size="13" font-weight="600" fill="#1d2230">Legal, ethics, repository review</text><text x="1368" y="662" font-size="13" font-weight="600" fill="#1d2230">Execute · implement · monitor</text><text x="1354" y="756" font-size="12" fill="#5a6273">Records to: Schedule A E.5 · module list</text><path d="M460,400 L486,400" stroke="#1f4e5f" stroke-width="2.4" marker-end="url(#ar)"></path><path d="M886,400 L912,400" stroke="#1f4e5f" stroke-width="2.4" marker-end="url(#ar)"></path><path d="M1312,400 L1338,400" stroke="#1f4e5f" stroke-width="2.4" marker-end="url(#ar)"></path><text x="473" y="394" font-size="11" fill="#5a6273" text-anchor="middle">tier</text><text x="899" y="394" font-size="11" fill="#5a6273" text-anchor="middle">AI use</text><text x="1325" y="394" font-size="11" fill="#5a6273" text-anchor="middle">findings</text><path d="M646,770 L646,820 L300,820 L300,772" fill="none" stroke="#7a5cab" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#al)"></path><text x="473" y="814" font-size="13" fill="#7a5cab" text-anchor="middle">Step 9 linkage → reclassify the linked object</text><path d="M1072,770 L1072,850 L300,850 L300,772" fill="none" stroke="#7a5cab" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#al)"></path><text x="686" y="844" font-size="13" fill="#7a5cab" text-anchor="middle">Outcome 2/3 tier changed → reclassify</text><path d="M1072,770 L1072,880 L726,880 L726,772" fill="none" stroke="#7a5cab" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#al)"></path><text x="899" y="874" font-size="13" fill="#7a5cab" text-anchor="middle">pathway affected → repeat Tool 2</text><path d="M1498,770 L1498,910 L300,910 L300,772" fill="none" stroke="#7a5cab" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#al)"></path><text x="899" y="904" font-size="13" fill="#7a5cab" text-anchor="middle">material change in object, purpose, recipient, jurisdiction, access, linkage, AI use or deployment → reassess</text><text x="60" y="960" font-size="13" fill="#5a6273">Rules throughout: an Unknown answer takes the more protective branch; no later answer removes an earlier restriction; no activity begins until every prerequisite recorded at Steps 6B, 7 and 13 is documented and the agreement is executed.</text><text x="60" y="980" font-size="13" fill="#5a6273">Public release is a distinct branch of Tool 2 Step 3 that opens only on a confirmed Tier 1 / 1b finding or a documented model-anonymity assessment at Tool 3 Step 7.</text>
</svg>