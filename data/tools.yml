- - '4'
  - 'Does this derived object have excess inferential capacity, that is, can it, alone or with information reasonably
    available to the intended recipient: (i) support inference about neurological, cognitive, emotional or behavioural
    states or traits outside the purpose for which the source neurodata were authorised; (ii) identify or trace
    a participant by itself (for example a functional-connectome fingerprint or a high-dimensional embedding unique
    to a participant); or (iii) reconstruct stimuli, speech, imagery or neural signals? Standard summary derivatives
    that reveal no more than the source dataset already reveals (for example regional volumes, connectivity matrices
    or spectral summaries used for the authorised purpose) do not satisfy this question and retain the source tier.
    Apply Annexure 1 §4.1.6 and the §2.1 distinction between ordinary aggregate description and material group-level
    Functional Exposure.'
