# The tier framework shown in the explorer (Introduction tab) and the tier figure.
# Source: Supplementary Figure 3 and MDTAA Annexure 1 §3 (revision of 26 October 2026). Highest applicable tier governs;
# safeguards are cumulative; uncertainty is governed under the more protective tier until resolved.
- id: '1'
  name: Tier 1 — Aggregated or functionally non-revealing neurodata
  description: Aggregated, statistical or summary-level information that contains no participant-level record, persistent
    participant trace or linkage mechanism and presents no reasonable small-group disclosure risk.
  examples:
  - Group-average brain-activation patterns
  - Aggregated connectivity measures and summary statistics
  - Published statistical results with no participant-level records
  - Sufficiently aggregated outputs from which no individual or small group can reasonably be identified
  background: '#f3f7fa'
  text_colour: '#1d2230'
- id: '2'
  name: Tier 2 — Pseudonymised or participant-linkable neurodata
  description: Participant-level neurodata from which direct identifiers have been removed but which may still be linked
    to an individual through a code, repository record, institutional key or other retained linkage mechanism.
  examples:
  - Pseudonymised EEG or MEG data linked to a participant code
  - De-identified MRI capable of re-linkage through a secure institutional key
  - Participant-level processed neurodata held in a controlled repository
  - Coded behavioural-neural datasets
  background: '#dbe7f0'
  text_colour: '#1d2230'
- id: '3'
  name: Tier 3 — Directly identifiable or intrinsically traceable neurodata
  description: Neurodata containing direct identifiers, recognisable identifying anatomy, identifying acquisition metadata
    or intrinsic signal characteristics that reasonably permit identification or tracing without relying solely on a
    separately protected code-to-identity mapping. A raw acquisition format does not, by itself, establish Tier 3.
  examples:
  - Non-defaced structural imaging; raw DICOM with headers or recognisable anatomy
  - EEG/MEG/ECoG retaining identifying metadata or demonstrated participant-tracing capacity
  - Implant telemetry or BCI recordings with device identifiers or precise timestamps
  - Neurodata associated with names, voice, video or other direct identifiers
  background: '#b9d0e2'
  text_colour: '#1d2230'
- id: '4'
  name: Tier 4 — Functionally revealing derivative neurodata
  description: Transformed or derived neurodata that may no longer resemble the source dataset but can reasonably reveal,
    predict, reconstruct or profile neurological, cognitive, emotional or behavioural states.
  examples:
  - Neural feature vectors, embeddings and neural fingerprints
  - Cognitive or behavioural profiles; classifiers and predictive outputs
  - Reconstructed visual, auditory or cognitive representations
  - Synthetic neurodata or latent representations retaining meaningful neural characteristics
  background: '#005981'
  text_colour: '#ffffff'
- id: '5'
  name: Tier 5 — Model-associated or computationally persistent neurodata
  description: Neurodata-derived information associated with an AI model or persistent computational infrastructure where
    the artefact retains, or may reasonably retain, continuing functional exposure through inference, reconstruction,
    extraction, profiling or memorisation. Incorporation into a model triggers assessment; it does not by itself
    establish Tier 5.
  examples:
  - Model weights trained on neurodata; neuroscience foundation models
  - Federated-learning systems and synthetic-data generators trained on neurodata
  - Persistent embedding repositories
  - AI systems that retain neurodata-derived information after the original research activity
  background: '#002b40'
  text_colour: '#ffffff'
