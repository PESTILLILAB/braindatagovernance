    ethics system).
  importer: US public university (IRB; not a HIPAA covered entity for this project; not a Brazilian research body,
    so unable to rely on the LGPD research basis).
  datadesc: Routine clinical EEG reports and raw traces, ICD diagnoses, age and sex, pseudonymised with a hospital-held
    key.
  data: EEG + diagnosis labels, pseudonymised
  origin: Brazil (LGPD; ANPD Res. 19/2024)
  dest: United States
  access: Downloadable copy
  tools:
    - tool: Tool 1
      result: Tier 2, confirmed.
      steps:
        - step: Check
          answer: Completed
          note: LGPD art. 13 (public-health study database) and art. 11; CEP/CONEP approval.
        - step: '1'
          answer: 'Yes'
