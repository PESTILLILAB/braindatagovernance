# Worked examples shown in the Toolkit explorer (Examples tab). Order = display order.
# Fields: id (unique, e.g. s17), short (card title), region, title, setting (the story), exporter, importer,
# datadesc, data, origin, dest, access, tools (one block per tool with its steps; step labels follow Supplementary Tables 6–9, revision of 26 October 2026),
# verdict_new (the determination; starting with "Do not" shows it in red), legal (list of legal points), counsel (questions for counsel).
- id: s1
  short: Germany → OpenNeuro (open deposit)
  region: Europe → North America
  title: Open deposit of defaced MRI/fMRI from a German lab on OpenNeuro under CC0
  setting: A cognitive-neuroscience lab at a German public university has finished a study on 120 healthy adults
    and wants to deposit the dataset on OpenNeuro, the open neuroimaging repository operated by Stanford University,
    under a CC0 licence. The data have been defaced, DICOM headers stripped and acquisition dates shifted, but the
    lab keeps its subject-code key for future follow-up. Participants signed a GDPR-edition Open Brain Consent form
    that mentions open, worldwide release.
  exporter: German public university, cognitive-neuroscience lab (controller under GDPR and §27 BDSG; ethics approval
    from the university committee).
  importer: 'OpenNeuro (Stanford University, United States): a public repository with no data-use agreement, CC0
    licensing and a stated prohibition on re-identification attempts; downstream users are the general public.'
  datadesc: T1-weighted structural MRI (1 mm), task fMRI runs and behavioural logs in BIDS format; defaced; no demographic
    detail beyond age band and sex; no clinical diagnoses.
  data: Structural and functional MRI, participant-level, defaced
  origin: Germany (GDPR, §27 BDSG)
  dest: United States (public repository)
  access: Downloadable copy, public
  tools:
    - tool: Tool 1 (the deposited copy)
      result: Tier 2A for the deposited copy (participant-level, de-identified, no linkage mechanism reasonably
        available to the recipient), assigned at Step 7; the lab’s own copy, which keeps the key, is Tier 2 (Step
        6).
      steps:
        - step: Check
          answer: Completed
          note: GDPR Art. 9(2)(j), §27 BDSG; university ethics approval; no EHDS or DPIA requirement identified
            for the deposit.
        - step: '1'
          answer: 'Yes'
          note: Structural and task fMRI in BIDS.
        - step: 2A
          answer: 'No'
          note: A dataset, not a model.
        - step: '3'
          answer: 'No'
          note: Original neurodata, not a derivative.
        - step: '5'
          answer: 'No'
          note: Defaced; headers and dates removed; tool and version recorded.
        - step: '6'
          answer: No (deposited copy)
          note: No code, repository record or key is available to OpenNeuro or downstream users; the lab’s copy
            answers Yes and is Tier 2.
        - step: '7'
          answer: 'No'
          note: 'Participant-level records remain: “Reassessment required”; Steps 3–6 confirmed; de-identified with
            no reasonably available linkage mechanism → Tier 2A.'
        - step: '8'
          answer: 'No'
          note: 'Disclosure-risk assessment for the public: healthy cohort, no rare diagnoses, residual-risk literature
            on defacing noted.'
        - step: Final
          answer: Tier 2A, confirmed
          note: 'Safeguards: documented de-identification, disclosure-risk assessment, re-identification prohibition
            carried by the repository terms.'
    - tool: Tool 2 (public-release pathway)
      result: 'Outcome 1 — Proceed: licence recorded; re-identification ban; takedown and response procedure documented.'
      steps:
        - step: '1'
          answer: Repository deposit; public/open-access release
          note: ''
        - step: '2'
          answer: 'Yes'
          note: Tier 2A, confirmed.
        - step: '3'
          answer: Public/open-access release proposed
          note: Object and version, releasing organisation (the lab), repository (OpenNeuro) and licence (CC0) recorded.
        - step: 4B
          answer: 'Yes'
          note: OpenNeuro, Stanford University and its hosting provider identified.
        - step: '5'
          answer: Public download/open-access repository release
          note: Direct download and redistribution enabled; no registration or embargo.
        - step: '6'
          answer: Public-release pathway
          note: Germany (origin and releasing organisation), United States (repository); future downloaders unknown
            by design.
        - step: '7'
          answer: 'Yes'
          note: Art. 9(2)(j) + §27 BDSG; Open Brain Consent covers worldwide release; ethics approval; release authority
            recorded.
        - step: 7A
          answer: 'No'
          note: No EHDS permit or statutory access authorisation.
        - step: 8B
          answer: 'Yes'
          note: De-identification and the repository’s re-identification prohibition operate at release.
        - step: 9B
          answer: 'No'
          note: No foreseeable linkage that changes exposure for a healthy, defaced cohort; assessment recorded.
        - step: 10B
          answer: 'Yes'
          note: AI reuse foreseeable under CC0; the object is a dataset, so no Tool 3 for the release itself.
        - step: 11B
          answer: 'Yes'
          note: Open reuse covered by the Open Brain Consent and ethics approval; scope recorded.
        - step: 12B
          answer: 'Yes'
          note: Redistribution permitted under CC0; compatible with the safeguards.
        - step: '13'
          answer: 'Yes'
          note: De-identification, licence terms, takedown procedure.
    - tool: Tool 3
      result: Not required.
      steps:
        - step: '1'
          answer: 'No'
          note: Routine preprocessing only; no separately governed derivative (Annexure 1 §7.2).
    - tool: Tool 4
      result: 'Step 1A: no MDTAA with the public; the release is governed by OpenNeuro’s terms and CC0.'
      steps:
        - step: '1'
          answer: 'No'
          note: No bilateral agreement with downstream users.
        - step: 1A
          answer: 'Yes'
          note: Repository terms and CC0 recorded; no separate MDTAA with OpenNeuro required. End of tool.
  verdict_new: Proceed (conditions documented)
  legal:
    - Tool 1 Step 7 assigns Tier 2A to participant-level data that are de-identified and have no reasonably available
      linkage mechanism (27 October 2026 revision); the label is defined only at that step, so the safeguards applied
      are those of Tier 2.
    - 'CJEU C-413/23 P (EDPS v SRB, 4 Sept 2025): pseudonymised data may be non-personal for a recipient without
      means of re-identification.'
    - Residual re-identification risk after defacing (Schwarz 2019; Steeg 2024) must be weighed in the Step 8 disclosure-risk
      assessment.
    - EU–US DPF is available only to FTC/DOT-regulated organisations; irrelevant for anonymous data, decisive if
      the data were personal.
  counsel:
    - Does the consent text cover open, worldwide release and commercial reuse?
    - Is the defacing method adequate for 7T or high-resolution T1 images?
    - Who answers a re-identification report, and how fast?
- id: s2
  short: Nigeria → Germany (federated, public weights)
  region: Africa → Europe
  title: Nigerian clinical EEG, federated training with a German consortium, public release of model weights
  setting: 'A federal teaching hospital in Lagos holds clinical EEG from 400 patients treated for epilepsy, including
    adolescents. A German university consortium proposes federated training of a seizure-detection model: raw EEG
    never leaves the hospital, model updates are aggregated on a cloud server, and the consortium wants to publish
    the final weights on a public model hub. This is the example used in the main text of the paper.'
  exporter: Nigerian federal teaching hospital (data controller under the NDPA 2023; NHREC-registered ethics committee;
    likely a ‘data controller of major importance’ with NDPC filing duties).
  importer: German university consortium (controllers under GDPR for gradients and weights; §27 BDSG research basis)
    with a cloud aggregation server run by a commercial provider; the public as recipient of the released weights.
  datadesc: Scalp EEG recordings (19–32 channels) with device identifiers and timestamps in the headers, seizure
    annotations, age, sex and medication; model gradients exchanged during training; final model weights and a model
    card.
  data: Clinical EEG with device identifiers; model gradients; trained weights
  origin: Nigeria (NDPA 2023; GAID 2025)
  dest: Germany (GDPR); public release
  access: Federated / query-only, then public weights
  tools:
    - tool: Tool 1 (hospital EEG)
      result: Tier 2, confirmed, after device identifiers and timestamps are stripped; Tier 3 while they remain.
      steps:
        - step: Check
          answer: Completed
          note: NDPA 2023 (sensitive data, s. 30); NHREC ethics clearance; NDPC filing duties for a controller of
            major importance.
        - step: '1'
          answer: 'Yes'
          note: ''
        - step: 2A
          answer: 'No'
          note: The dataset itself has not been incorporated into a model; the weights are assessed separately below.
        - step: '3'
          answer: 'No'
          note: ''
        - step: '5'
          answer: Yes → stripped → No
          note: Device identifiers and timestamps in the headers gave Tier 3; after stripping, reassessed.
        - step: '6'
          answer: 'Yes'
          note: Hospital holds the key; data never leave the hospital.
        - step: Final
          answer: Tier 2, confirmed
          note: ''
    - tool: Tool 2 (training pathway, controlled access)
      result: Outcome 2 — Proceed after the NDPA transfer basis and NHREC clearance are documented and the cloud
        safeguards are verified.
      steps:
        - step: '1'
          answer: Share with another institution; cloud-hosted access; AI platform access
          note: ''
        - step: '2'
          answer: 'Yes'
          note: Tier 2.
        - step: '3'
          answer: Named controlled-access recipients
          note: German consortium and the commercial cloud aggregator.
        - step: 4A
          answer: 'Yes'
          note: Consortium members, cloud provider and sub-processors listed.
        - step: '5'
          answer: Query-only or federated access
          note: Raw EEG stays in Lagos; gradients leave.
        - step: '6'
          answer: 'Yes'
          note: Gradients received in Germany and on the aggregation server.
        - step: '7'
          answer: Pending
          note: NDPA ss. 41–43 transfer basis (adequacy, approved safeguard or s. 43 condition) recorded under s.
            41(2); s. 30 sensitive-data basis; NHREC clearance naming the German parties; German side Art. 9(2)(j)
            + §27 BDSG.
        - step: 7A
          answer: 'No'
          note: ''
        - step: 8A
          answer: 'Yes'
          note: Consortium governance and cloud controls documented; audit logging to be verified at Step 13.
        - step: 9A
          answer: 'No'
          note: ''
        - step: 10A
          answer: 'Yes'
          note: Model training → Tool 3 completed for the weights before this pass can finish.
        - step: 11A
          answer: 'No'
          note: Seizure detection is the approved purpose.
        - step: 12A
          answer: 'Yes'
          note: Cloud aggregator as sub-processor; onward transfer otherwise prohibited.
        - step: '13'
          answer: No, but they can be implemented
          note: Gradient encryption, access logging, aggregation-server location.
    - tool: Tool 3 (released weights)
      result: Outcome 1 — Retain the existing tier for the released weights (Tier 1 after documented leakage testing);
        development checkpoints and gradients remain under Tier 5 safeguards.
      steps:
        - step: '1'
          answer: 'Yes'
          note: Model training and persistence; AI activity flagged by Tool 2 Step 10A, so no exemption.
        - step: '2'
          answer: Trained model, gradients, checkpoints
          note: ''
        - step: '3'
          answer: 'Yes'
          note: Weights circulate independently.
        - step: '4'
          answer: Unknown → tested → No
          note: Extraction and membership-inference tests.
        - step: '5'
          answer: 'No'
          note: Seizure detection; no inference beyond the authorised purpose.
        - step: '6'
          answer: Yes → revised after testing
          note: Persistence possible in principle; candidate Tier 5 pending Step 7.
        - step: '7'
          answer: Yes — no material exposure identified
          note: Extraction, inversion and membership-inference tests documented for the public-release conditions.
        - step: '8'
          answer: 'Yes'
          note: Provenance, versions, vendors recorded.
        - step: '9'
          answer: 'Yes'
          note: Public release changes exposure → Tool 2 public-release pathway marked.
        - step: 9A
          answer: 'Yes'
          note: Outputs assessed against NHREC and consortium release conditions.
        - step: '10'
          answer: 'Yes'
          note: Checkpoint retirement and unlearning plan.
        - step: '11'
          answer: 'Yes'
          note: ''
    - tool: Tool 2 (release pathway, public)
      result: Outcome 1 — Release the weights under a model licence (no re-identification; no retraining for employment
        or insurance screening) with a takedown procedure.
      steps:
        - step: '3'
          answer: Public/open-access release proposed
          note: Weights v1.0, consortium as releasing organisation, public model hub, licence.
        - step: 4B
          answer: 'Yes'
          note: ''
        - step: '5'
          answer: Public download
          note: ''
        - step: '6'
          answer: Public-release pathway
          note: Germany and Nigeria as origins; hub hosting jurisdiction; downloaders unknown by design.
        - step: '7'
          answer: 'Yes'
          note: 'Release authority: NHREC approval names the public release; consortium approval.'
        - step: 7A
          answer: 'No'
          note: ''
        - step: 8B
          answer: 'Yes'
          note: 'Safeguards operate at release: tested model, licence terms, model card.'
        - step: 9B
          answer: 'No'
          note: ''
        - step: 10B
          answer: 'Yes'
          note: AI reuse foreseeable; Tool 3 completed for the weights.
        - step: 11B
          answer: Yes → narrowed
          note: Field-of-use licence limits reuse to the authorised scope.
        - step: 12B
          answer: 'Yes'
          note: Redistribution permitted under the licence.
        - step: '13'
          answer: 'Yes'
          note: ''
    - tool: Tool 4
      result: MDTAA between the hospital, the consortium and the aggregator; the public release sits outside it
        (Step 1A).
      steps:
        - step: '1'
          answer: 'Yes'
          note: ''
        - step: '2'
          answer: 'Yes'
          note: Nigeria → Germany; NDPA transfer basis recorded.
        - step: '6'
          answer: 'Yes'
          note: AI and model governance.
        - step: '7'
          answer: 'Yes'
          note: Federated infrastructure and cloud aggregator.
        - step: '8'
          answer: 'Yes'
          note: Cloud aggregator as sub-processor.
        - step: '13'
          answer: 'Yes'
          note: Seizure detection only.
        - step: '16'
          answer: 'Yes'
          note: Checkpoint retention and unlearning.
        - step: '18'
          answer: 'Yes'
          note: Local analytical access, training and co-authorship.
        - step: '20'
          answer: 'Yes'
          note: Coordination with the cloud contract and hub terms; governing law chosen.
  verdict_new: 'Proceed in two passes: training (Outcome 2), then release (Outcome 1)'
  legal:
    - 'NDPA 2023 ss. 41–43: adequacy, appropriate safeguards or a s. 43 condition; record the basis (s. 41(2));
      GAID 2025 instruments and filings [verify current NDPC list].'
    - EDPB Opinion 28/2024 provides the model-anonymity test applied at Tool 3 Step 7.
    - Gradients can be personal data (membership inference); treat as such until tested.
  counsel:
    - Has the NDPC designated any adequate country or approved instrument that covers Germany?
    - Does the NHREC approval name the German parties and the public release?
    - Which model licence terms are enforceable against downstream users?
- id: s3
  short: South Africa → UK (downloadable copy)
  region: Africa → Europe
  title: South African university shares pseudonymised fMRI and clinical data with a UK university
  setting: A South African university hospital research group has collected task fMRI and clinical depression scores
    from 90 adults and wants to send a downloadable, pseudonymised copy to a UK university for joint analysis of
    treatment response. South Africa has no adequacy list under POPIA and health data are ‘special personal information’,
    so the Information Regulator’s prior-authorisation rule is in play.
  exporter: South African public university and its academic hospital (responsible party under POPIA; information
    officer; NHREC-registered REC).
  importer: UK university research department (controller under UK GDPR; DPA 2018 research condition; university
    ethics approval).
  datadesc: Task fMRI (defaced, headers removed), structural scans, clinical depression inventories, medication
    history and demographics, pseudonymised with a code held by the South African group.
  data: fMRI + clinical scores, pseudonymised
  origin: South Africa (POPIA)
  dest: United Kingdom (UK GDPR)
  access: Downloadable copy
  tools:
    - tool: Tool 1
      result: Tier 2, confirmed.
      steps:
        - step: Check
          answer: Completed
          note: POPIA s. 26 special personal information; s. 57 prior authorisation flagged; NHREC-registered REC
            approval.
        - step: '1'
          answer: 'Yes'
          note: ''
        - step: 2A
          answer: 'No'
          note: ''
        - step: '3'
          answer: 'No'
          note: ''
        - step: '5'
          answer: 'No'
          note: Defaced; headers removed.
        - step: '6'
          answer: 'Yes'
          note: The South African group holds the key; the UK group could request re-linkage for follow-up.
        - step: Final
          answer: Tier 2, confirmed
          note: ''
    - tool: Tool 2 (controlled access)
      result: Outcome 2 — Proceed once the s. 57 authorisation (or a documented s. 72(1)(a) assessment) and the
        agreement are in place and the safeguards are verified.
      steps:
        - step: '1'
          answer: Share with another institution; international transfer
          note: ''
        - step: '2'
          answer: 'Yes'
          note: ''
        - step: '3'
          answer: Named controlled-access recipient
          note: ''
        - step: 4A
          answer: 'Yes'
          note: ''
        - step: '5'
          answer: Downloadable copy
          note: ''
        - step: '6'
          answer: 'Yes'
          note: South Africa → United Kingdom.
        - step: '7'
          answer: Pending
          note: POPIA s. 72(1)(a) binding agreement with substantially similar protections and an onward-transfer
            clause, or s. 57(1)(d) prior authorisation from the Information Regulator; REC approval; UK side UK
            GDPR Art. 9(2)(j) + DPA 2018 Sch. 1 para 4.
        - step: 7A
          answer: 'No'
          note: ''
        - step: 8A
          answer: 'Yes'
          note: UK university controls documented.
        - step: 9A
          answer: 'No'
          note: ''
        - step: 10A
          answer: 'No'
          note: ''
        - step: 11A
          answer: 'No'
          note: ''
