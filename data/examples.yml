          answer: 'No'
          note: Analysis only; no model release planned.
    - tool: Tool 4
      result: MDTAA with the cross-border, enhanced-protection and no-onward-transfer modules.
      steps:
        - step: '1'
          answer: 'Yes'
          note: ''
        - step: '2'
          answer: 'Yes'
          note: s. 72 undertakings carried into Schedule C.
        - step: '4'
          answer: 'Yes'
          note: Tier 2 safeguards.
        - step: '9'
          answer: 'Yes'
          note: No onward transfer without written approval.
        - step: '11'
          answer: 'Yes'
