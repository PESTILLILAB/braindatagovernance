# Worked examples shown in the Toolkit explorer (Examples tab). Order = display order.
# Fields: id (unique, e.g. s17), short (card title), region, title, setting (the story), exporter, importer,
# datadesc, data, origin, dest, access, tools (one block per tool with its steps), verdict_new (the determination;
# starting with "Do not" shows it in red), legal (list of legal points), counsel (questions for counsel).
- id: s1
  short: Germany → OpenNeuro (open deposit)
  region: Europe → North America
  title: Open deposit of defaced MRI/fMRI from a German lab on OpenNeuro under CC0
  setting: A cognitive-neuroscience lab at a German public university has finished a study on 120 healthy adults
    and wants to deposit the dataset on OpenNeuro, the open neuroimaging repository operated by Stanford University,
    under a CC0 licence. The data have been defaced, DICOM headers stripped and acquisition dates shifted, but the
    lab keeps its subject-code key for future follow-up. Participants signed a GDPR-edition Open Brain Consent form
    that mentions open, worldwide release.
  exporter: German public university, cognitive-neuroscience lab (controller under GDPR and §27 BDSG; ethics approval
    from the university committee).
  importer: 'OpenNeuro (Stanford University, United States): a public repository with no data-use agreement, CC0
    licensing and a stated prohibition on re-identification attempts; downstream users are the general public.'
  datadesc: T1-weighted structural MRI (1 mm), task fMRI runs and behavioural logs in BIDS format; defaced; no demographic
    detail beyond age band and sex; no clinical diagnoses.
  data: Structural and functional MRI, participant-level, defaced
  origin: Germany (GDPR, §27 BDSG)
  dest: United States (public repository)
  access: Downloadable copy, public
  tools:
  - tool: Tool 1
    result: Tier 1b for the public; Tier 2 for the lab's own copy. Confirmed.
    steps:
    - step: 0B
      answer: 'No'
      note: Consenting adults; no vulnerability flag.
    - step: 2A
      answer: 'No'
      note: The object is a dataset, not a model.
    - step: '5'
      answer: 'No'
      note: Defaced; headers and dates removed; tool and version recorded.
    - step: '6'
      answer: No (public) / Yes (lab)
      note: Key not available to OpenNeuro or its users; lab retains it.
    - step: '7'
      answer: 'No'
      note: Participant-level, so candidate Tier 1b.
    - step: '8'
      answer: 'No'
      note: 'Disclosure-risk assessment for the public: healthy cohort, no rare diagnoses, residual-risk literature
        noted.'
  - tool: Tool 2
    result: Outcome 1 — Proceed. Licence recorded; re-identification ban; takedown and response procedure documented.
    steps:
    - step: '1'
      answer: Repository deposit
      note: ''
    - step: '3'
      answer: Public or unrestricted release
      note: 'Permitted: Tool 1 holds a confirmed Tier 1b finding for the public.'
    - step: '5'
      answer: Downloadable copy
      note: ''
    - step: '6'
      answer: 'Yes'
      note: Hosting in the United States.
    - step: 6A
      answer: North American governance unit
      note: No transfer mechanism required for data anonymous to the recipient; DPF would be unavailable to a university
        anyway.
    - step: 6B
      answer: 'No'
      note: No prohibition, localisation, authorisation, sanctions or permit.
    - step: 7(i)
      answer: 'Yes'
      note: Art. 9(2)(j) GDPR + §27 BDSG; consent covers open release (Open Brain Consent); ethics approval on file.
    - step: 7(ii)
      answer: 'Yes'
      note: OpenNeuro terms recorded; no GDPR obligations on the repository.
    - step: 9 / 10 / 11
      answer: 'No'
      note: ''
    - step: '12'
      answer: Public release
      note: Onward use governed by CC0 plus the repository's re-identification prohibition.
    - step: '13'
      answer: 'Yes'
      note: De-identification, licence terms, takedown procedure.
  - tool: Tool 3
    result: Not required.
    steps:
    - step: '1'
      answer: 'No'
      note: No transformation by the depositor.
  - tool: Tool 4
    result: Not required.
    steps:
    - step: '1'
      answer: 'No'
      note: No bilateral agreement for a public deposit.
  old: 'Tool 1: Step 6 ''Yes'' (key exists) → Tier 2 → controlled access and a DUA, incompatible with CC0; or Step
    7 → ''Unclassified — specialist review''. Tool 2: Step 3 ''unknown recipients'' → Outcome 4.'
  verdict_old: Blocked / false barrier
  verdict_new: Proceed (conditions documented)
  legal:
  - 'CJEU C-413/23 P (EDPS v SRB, 4 Sept 2025): pseudonymised data may be non-personal for a recipient without means
    of re-identification.'
  - Residual re-identification risk after defacing (Schwarz 2019; Steeg 2024) must be weighed in the Step 8 assessment.
  - EU–US DPF is available only to FTC/DOT-regulated organisations; irrelevant for anonymous data, decisive if the
    data were personal.
  counsel:
  - Does the consent text cover open, worldwide release and commercial reuse?
  - Is the defacing method adequate for 7T or high-resolution T1 images?
  - Who answers a re-identification report, and how fast?
- id: s2
  short: Nigeria → Germany (federated, public weights)
  region: Africa → Europe
  title: Nigerian clinical EEG, federated training with a German consortium, public release of model weights
  setting: 'A federal teaching hospital in Lagos holds clinical EEG from 400 patients treated for epilepsy, including
    adolescents. A German university consortium proposes federated training of a seizure-detection model: raw EEG
    never leaves the hospital, model updates are aggregated on a cloud server, and the consortium wants to publish
    the final weights on a public model hub. This is the example used in the main text of the paper.'
  exporter: Nigerian federal teaching hospital (data controller under the NDPA 2023; NHREC-registered ethics committee;
    likely a ‘data controller of major importance’ with NDPC filing duties).
  importer: German university consortium (controllers under GDPR for gradients and weights; §27 BDSG research basis)
    with a cloud aggregation server run by a commercial provider; the public as recipient of the released weights.
  datadesc: Scalp EEG recordings (19–32 channels) with device identifiers and timestamps in the headers, seizure
    annotations, age, sex and medication; model gradients exchanged during training; final model weights and a model
    card.
  data: Clinical EEG with device identifiers; model gradients; trained weights
  origin: Nigeria (NDPA 2023; GAID 2025)
  dest: Germany (GDPR); public release
  access: Federated / query-only, then public weights
  tools:
  - tool: Tool 1
    result: Tier 2, confirmed; nothing below Tier 2 is available because of Step 0B.
    steps:
    - step: 0B
      answer: 'Yes'
      note: Patients in a dependent relationship; some minors → minimum tier uplifted by one.
    - step: 2A
      answer: 'No'
      note: Dataset, not a model.
    - step: '5'
      answer: Yes → strip → No
      note: Device IDs and timestamps gave Tier 3; after stripping, reassessed.
    - step: '6'
      answer: 'Yes'
      note: Hospital holds the key; data stay in the hospital.
  - tool: Tool 2 (training pathway)
    result: Outcome 2 — Proceed after the 6B prerequisites are documented; cannot reach Outcome 1 until then.
    steps:
    - step: '3'
      answer: Named consortium + cloud aggregator
      note: Aggregation server location recorded.
    - step: '5'
      answer: Federated / query-only
      note: Raw EEG stays; gradients leave.
    - step: '6'
      answer: 'Yes'
      note: Gradients received in Germany.
    - step: 6A
      answer: Class B
      note: 'Nigeria → Germany: standard instrument under origin law; MDTAA module T-NG marked.'
    - step: 6B
      answer: 'Yes: (c) and (e)'
      note: NDPA s. 41(2) record and NDPC-recognised safeguard; NHREC clearance for the international collaboration.
    - step: 7(i)
      answer: Pending
      note: s. 30 sensitive-data basis; instrument from 6A; authority under consent and ethics.
    - step: 7(ii)
      answer: 'Yes'
      note: 'German importer: Art. 9(2)(j) + §27 BDSG for gradients, treated as personal data pending Tool 3.'
    - step: '10'
      answer: 'Yes'
      note: AI training → Tool 3 required before this pass can finish.
  - tool: Tool 3 (weights)
    result: 'Released weights: Outcome 1 with the documented anonymity assessment. Development checkpoints and gradients:
      Tier 5 confirmed, controlled.'
    steps:
    - step: '1'
      answer: 'Yes'
      note: Model training and persistence.
    - step: '3'
      answer: 'Yes'
      note: Weights circulate independently.
    - step: '4'
      answer: Unknown → test
      note: Can the weights trace a participant?
    - step: '5'
      answer: 'No'
      note: Seizure detection is the authorised purpose; no excess inference.
    - step: '6'
      answer: 'Yes'
      note: Persistence possible → candidate Tier 5.
    - step: '7'
      answer: Tested, no material exposure
      note: Extraction, membership-inference and query tests documented for public release.
    - step: 9 / 9A
      answer: Public release flagged
      note: Output-release conditions assessed.
    - step: '10'
      answer: 'Yes'
      note: Checkpoint retirement and unlearning plan.
  - tool: Tool 2 (release pathway)
    result: Outcome 1 — Release with licence (no re-identification, no retraining for employment or insurance screening)
      and takedown procedure.
    steps:
    - step: '3'
      answer: Public release
      note: Permitted because Tool 3 Step 7 holds the documented assessment.
    - step: 6B(d)
      answer: 'No'
      note: No US party; DOJ programme not engaged.
    - step: '12'
      answer: Public release
      note: Model licence with field-of-use limits.
  - tool: Tool 4
    result: MDTAA executed with the Nigeria transfer-instrument module; no EU SCC material.
    steps:
    - step: '2'
      answer: Cross-border + T-NG
      note: ''
    - step: '6'
      answer: AI and model governance
      note: ''
    - step: '7'
      answer: Controlled access
      note: ''
    - step: '13'
      answer: Permitted inference
      note: Seizure detection only.
    - step: '16'
      answer: Persistent artefacts and unlearning
      note: ''
    - step: '18'
      answer: Benefit sharing
      note: Local analytical access and co-authorship.
    - step: '20'
      answer: Coordination; governing law
      note: Nigerian or German law chosen from the menu.
  old: Tool 2 Step 3 'unknown recipients' for the public weights → Outcome 4; the paper's own example could not
    be completed. Step 7's generic 'Yes' would also have let the training pathway reach Outcome 1 without the NDPA
    or NHREC checks.
  verdict_old: Blocked
  verdict_new: Proceed in two gated passes
  legal:
  - 'NDPA 2023 ss. 41–43: adequacy, appropriate safeguards or a s. 43 condition; record the basis (s. 41(2)); GAID
    2025 instruments and filings [verify current NDPC list].'
  - EDPB Opinion 28/2024 provides the model-anonymity test used at Tool 3 Step 7.
  - Gradients can be personal data (membership inference); treat as such until tested.
  counsel:
  - Has the NDPC designated any adequate country or approved instrument that covers Germany?
  - Does the NHREC approval name the German parties and the public release?
  - Which model licence terms are enforceable against downstream users?
- id: s3
  short: South Africa → UK (downloadable copy)
  region: Africa → Europe
  title: South African university shares pseudonymised fMRI and clinical data with a UK university
  setting: A South African university hospital research group has collected task fMRI and clinical depression scores
    from 90 adults and wants to send a downloadable, pseudonymised copy to a UK university for joint analysis of
    treatment response. South Africa has no adequacy list under POPIA and health data are ‘special personal information’,
    so the Information Regulator’s prior-authorisation rule is in play.
  exporter: South African public university and its academic hospital (responsible party under POPIA; information
    officer; NHREC-registered REC).
  importer: UK university research department (controller under UK GDPR; DPA 2018 research condition; university
    ethics approval).
  datadesc: Task fMRI (defaced, headers removed), structural scans, clinical depression inventories, medication
    history and demographics, pseudonymised with a code held by the South African group.
  data: fMRI + clinical scores, pseudonymised
  origin: South Africa (POPIA)
  dest: United Kingdom (UK GDPR)
  access: Downloadable copy
  tools:
  - tool: Tool 1
    result: Tier 2, confirmed.
    steps:
    - step: 0B
      answer: 'Yes'
      note: Patients; dependent relationship → uplift.
    - step: '5'
      answer: 'No'
      note: Defaced; headers removed.
    - step: '6'
      answer: 'Yes'
      note: UKZN holds the key; York could request re-linkage for follow-up.
  - tool: Tool 2
    result: Outcome 2 — Proceed once the s. 57 authorisation (or documented s. 72(1)(a) assessment) and the agreement
      are in place.
    steps:
    - step: '3'
      answer: Named institution
      note: ''
    - step: '5'
      answer: Downloadable copy
      note: ''
    - step: 6A
      answer: Class B
      note: South Africa → UK.
    - step: 6B
      answer: 'Yes: (c)'
      note: 'POPIA s. 57(1)(d): health data to a country without an adequacy finding → prior authorisation from
        the Information Regulator, unless s. 72(1)(a) adequacy is documented.'
    - step: 7(i)
      answer: Pending
      note: s. 72(1)(a) binding agreement with substantially similar protections and onward-transfer clause; NHREC-registered
        REC approval; SA DTA 1.1 language.
    - step: 7(ii)
      answer: 'Yes'
      note: 'York: UK GDPR Art. 9(2)(j) + DPA 2018 Sch. 1 para 4.'
    - step: '13'
      answer: No, but can be implemented
      note: Encryption, role-based access, audit log.
  - tool: Tool 3
    result: Not required (reassess if models are built).
    steps:
    - step: '1'
      answer: 'No'
      note: Analysis only, no model release planned.
  - tool: Tool 4
    result: MDTAA with the South Africa module; EU SCC articles not activated.
    steps:
    - step: '2'
      answer: Cross-border + T-ZA
      note: Schedule ZA adopts SA DTA 1.1 s. 72 undertakings.
    - step: '4'
      answer: Enhanced protection
      note: Tier 2 with 0B uplift.
    - step: '9'
      answer: No onward transfer
      note: Without UKZN's written approval.
    - step: '20'
      answer: Governing law
      note: South African law selected; no EU court clause.
  old: Step 7's single question accepted 'Yes' without surfacing POPIA s. 57; the contract would have carried SCC
    Clause 17/18 (EU Member State law and courts).
  verdict_old: Gap / contract unusable
  verdict_new: Proceed after authorisation
  legal:
  - POPIA s. 72(1)(a)–(e) transfer grounds; s. 57(1)(d) prior authorisation; s. 26 special personal information.
  - No South African adequacy list exists; institutions either apply under s. 57 or document s. 72(1)(a).
  - NHREC Guidelines 3rd ed. (2024).
  counsel:
  - Will the Regulator treat the UK as providing adequate protection for s. 57 purposes?
  - Does the DTA's onward-transfer clause satisfy s. 72(1)(a)(ii)?
- id: s4
  short: Brazil → United States (public-health database)
  region: Latin America → North America
  title: Brazilian university hospital sends pseudonymised EEG and clinical labels to a US university for machine
    learning
  setting: A Brazilian university hospital research body has accessed a public-health study database (EEG with diagnoses)
    under LGPD art. 13 and a US university wants a downloadable copy to train a classifier. The Brazilian side has
    CEP approval and participant consent, and assumes this is enough; the LGPD prohibition on transferring art.
    13 databases to third parties is the decisive rule.
  exporter: Brazilian university hospital research body (‘órgão de pesquisa’ under LGPD art. 5 XVIII; CEP/CONEP
    ethics system).
  importer: US public university (IRB; not a HIPAA covered entity for this project; not a Brazilian research body,
    so unable to rely on the LGPD research basis).
  datadesc: Routine clinical EEG reports and raw traces, ICD diagnoses, age and sex, pseudonymised with a hospital-held
    key.
  data: EEG + diagnosis labels, pseudonymised
  origin: Brazil (LGPD; ANPD Res. 19/2024)
  dest: United States
  access: Downloadable copy
  tools:
  - tool: Tool 1
    result: Tier 2, confirmed.
    steps:
    - step: 0B
      answer: 'Yes'
      note: Patients.
    - step: '6'
      answer: 'Yes'
      note: Hospital holds the key.
  - tool: Tool 2
    result: 'Outcome 3 — Redesign: analysis inside the Brazilian environment (remote or federated access) with export
      of results only; or re-base the dataset outside art. 13.'
    steps:
    - step: '3'
      answer: Named institution
      note: ''
    - step: 6A
      answer: North American governance unit
      note: US not ANPD-adequate; standard instrument needed.
    - step: 6B
      answer: 'Yes: (a)'
      note: 'LGPD art. 13 §2: a research body may not transfer a public-health study database to any third party.
        Also (c): CONEP approval of the international collaboration.'
  - tool: Tool 2 (redesigned)
    result: Outcome 2 — Proceed after CONEP approval and the access environment are documented.
    steps:
    - step: '5'
      answer: Remote access, no download
      note: UT Austin analysts work in the hospital's secure environment.
    - step: '6'
      answer: 'Yes'
      note: Remote access from the US.
    - step: 6A
      answer: Governance unit
      note: ''
    - step: 6B
      answer: (c)
      note: CONEP approval; ANPD standard clauses for any residual transfer of personal data (results are anonymised).
    - step: 7(i)
      answer: 'Yes'
      note: art. 11 II(c) for the Brazilian research body; consent scope checked.
    - step: 7(ii)
      answer: 'Yes'
      note: IRB; HIPAA not engaged.
  - tool: Tool 3
    result: Outcome 4 until output-release review is done; model stays inside the environment.
    steps:
    - step: '1'
      answer: 'Yes'
      note: Classifier trained inside the environment.
    - step: 9A
      answer: Pending
      note: Release conditions for model and results.
  - tool: Tool 4
    result: MDTAA with the Brazil module; EU SCC Clause 8 not incorporated.
    steps:
    - step: '2'
      answer: Cross-border + T-BR
      note: ANPD standard clauses attached unmodified; §6(a) art. 13 warranty.
    - step: '7'
      answer: Controlled access
      note: ''
    - step: 7A
      answer: Statutory conditions
      note: CONEP conditions recorded.
    - step: '20'
      answer: Governing law
      note: Brazilian law.
  old: A PI with CEP approval and consent answered Step 7 'Yes' and received Outcome 1 — a false reassurance, because
    art. 13 §2 forbids the transfer outright.
  verdict_old: False reassurance
  verdict_new: Redesign, then Proceed
  legal:
  - LGPD art. 13 caput and §2; art. 5 XVIII (research body must be Brazil-seated); art. 11 II(c) unavailable to
    the US recipient.
  - 'Res. CD/ANPD 19/2024: standard clauses mandatory and unmodifiable; adaptation period ended 23 Aug 2025.'
  - EU–Brazil mutual adequacy (26 Jan 2026) does not help a US destination.
  counsel:
  - Is the dataset an art. 13 public-health study database, or a clinical research dataset outside art. 13?
  - Does CONEP require a specific international-collaboration approval for remote access?
- id: s5
  short: Texas hospital → Berlin (HIPAA de-identified)
  region: North America → Europe
  title: Texas HIPAA-covered hospital sends Safe-Harbor de-identified intracranial EEG to Charité
  setting: A Texas hospital that is a HIPAA covered entity has intracranial EEG from 60 epilepsy-surgery patients
    and wants to send a Safe-Harbor de-identified copy to Charité in Berlin for a methods collaboration. Dates are
    shifted and all 18 HIPAA identifiers removed; the hospital keeps the re-identification key.
  exporter: Texas academic hospital (HIPAA covered entity; IRB; de-identification determination under 45 CFR 164.514(b)).
  importer: Charité – Universitätsmedizin Berlin (controller under GDPR; Art. 9(2)(j) research basis; Berlin data-protection
    law for hospitals).
  datadesc: Intracranial EEG (sEEG/ECoG) with electrode coordinates, seizure-onset annotations with shifted timestamps,
    age band, sex and surgical outcome; no names, dates or device serials.
  data: Intracranial EEG, HIPAA de-identified
  origin: United States (HIPAA; Common Rule)
  dest: Germany (GDPR)
  access: Downloadable copy
  tools:
  - tool: Tool 1
    result: Tier 1b for Charité (recipient-relative), Tier 2 for the hospital; with the 0B uplift, Tier 2 governs
      the pathway.
    steps:
    - step: 0B
      answer: 'Yes'
      note: Surgical patients → uplift.
    - step: '5'
      answer: 'No'
      note: Identifiers removed per 45 CFR 164.514(b).
    - step: '6'
      answer: No (Charité) / Yes (hospital)
      note: Key stays in Texas.
  - tool: Tool 2
    result: Outcome 1 — Proceed, with the recipient-relative status recorded in Schedule B.
    steps:
    - step: '3'
      answer: Named institution
      note: ''
    - step: 6A
      answer: Governance unit → EU
      note: No US transfer mechanism; import into the EU needs no mechanism.
    - step: 6B
      answer: '(d) screened: No'
      note: Germany is not a country of concern under 28 CFR 202.
    - step: 7(i)
      answer: 'Yes'
      note: IRB approval; de-identification determination documented; no DUA needed (would be needed for a Limited
        Data Set).
    - step: 7(ii)
      answer: 'Yes'
      note: 'Charité: Art. 9(2)(j) basis recorded in case the data are personal for it.'
  - tool: Tool 3
    result: Outcome 1 for internal use; release gate applies later.
    steps:
    - step: '1'
      answer: 'Yes'
      note: Charité will train models.
    - step: '7'
      answer: To be tested before any release
      note: ''
  - tool: Tool 4
    result: MDTAA with the US module.
    steps:
    - step: '2'
      answer: Cross-border + T-US
      note: HIPAA status and DSP screening recorded.
    - step: '6'
      answer: AI and model governance
      note: ''
    - step: '20'
      answer: Governing law
      note: Texas law; Article 14.1 public-university liability limitation completed.
  old: Worked adequately (Tier 2, Outcome 1), but the 'lawful basis' wording was foreign to a US user and the recipient-relative
    status was not recordable.
  verdict_old: Works (wording caveats)
  verdict_new: Proceed
  legal:
  - 45 CFR 164.514(b) de-identification; 164.514(e) Limited Data Set DUA if dates were retained.
  - 'OHRP 2008 coded private information guidance: not human-subjects research for the recipient without the key.'
  - 28 CFR Part 202 applies only to countries of concern and covered persons.
  counsel:
  - Would date-shifted timestamps plus seizure-onset times be identifying in combination with publications?
  - Does Charité need a DPIA for intracranial recordings?
- id: s6
  short: United States → Cuba
  region: North America → Latin America
  title: UT Austin shares a 2,500-participant MEG/EEG cohort with the Cuban Neuroscience Center
  setting: A US public university wants to share a 2,500-participant MEG/EEG ageing cohort, coded but with cognitive
    scores, with the Cuban Neuroscience Center in Havana under a long-standing collaboration. Cuba is a sampled
    jurisdiction and a ‘country of concern’ under the US Data Security Program, so sanctions and data-security screening
    decide the case.
  exporter: US public university (IRB; Common Rule; subject to the DOJ Data Security Program and OFAC as a US person).
  importer: Cuban Neuroscience Center (CNEURO), a state research institute in Havana.
  datadesc: Resting-state MEG and EEG, cognitive test scores, age, sex, education, APOE status for a subset; coded
    with the key held in Austin.
  data: MEG/EEG with cognitive scores, coded
  origin: United States
  dest: Cuba
  access: Downloadable copy requested
  tools:
  - tool: Tool 1
    result: Tier 2, confirmed.
    steps:
    - step: 0B
      answer: 'Yes'
      note: Older adults, some with impairment → uplift.
    - step: '6'
      answer: 'Yes'
      note: Key held in Austin.
  - tool: Tool 2
    result: Outcome 2 or 3 — Proceed only after screening documents that the transaction is exempt or licensed;
      otherwise redesign to remote analysis with aggregate outputs.
    steps:
    - step: '3'
      answer: Named institution
      note: ''
    - step: 6A
      answer: Governance unit → LAC
      note: ''
    - step: 6B
      answer: 'Yes: (d)'
      note: Cuba is a country of concern under 28 CFR Part 202 (DOJ Data Security Program); personal health data
        threshold 10,000 and biometric identifiers 1,000 must be checked; covered-person rules; OFAC Cuban Assets
        Control Regulations govern the collaboration; EAR for software.
    - step: 7(i)
      answer: Pending
      note: Screening memorandum; OFAC general licence basis; IRB consent scope for international sharing.
  - tool: Tool 3
    result: Not required.
    steps:
    - step: '1'
      answer: 'No'
      note: ''
  - tool: Tool 4
    result: MDTAA with the US module.
    steps:
    - step: '2'
      answer: Cross-border + T-US
      note: Screening record in Schedule US.
    - step: '9'
      answer: No onward transfer
      note: ''
    - step: '19'
      answer: Project-specific
      note: Export-control and licence conditions.
  old: No sanctions or national-security question anywhere in Tool 2; Step 7 'Yes' → Outcome 1. Export controls
    appeared only as an optional example at Tool 4 Step 19.
  verdict_old: False reassurance
  verdict_new: Proceed after screening (or redesign)
  legal:
  - 28 CFR Part 202, effective 8 April 2025; affirmative obligations from 5 October 2025; countries of concern include
    Cuba and Venezuela.
  - OFAC 31 CFR Part 515; research exemptions and general licences.
  - Thresholds are counted over the preceding 12 months across transactions.
  counsel:
  - Does the cohort size and data type meet a bulk threshold, and is any recipient a 'covered person'?
  - Which OFAC general licence covers the collaboration and the data exchange?
- id: s7
  short: Québec → France (secure enclave)
  region: North America → Europe
  title: McGill gives ICM Paris remote-only access to pseudonymised 7T MRI plus genomic data
  setting: The Montreal Neurological Institute (McGill) will give researchers at the Paris Brain Institute (ICM)
    remote-only access to 7T MRI and genomic variants inside a Montréal secure enclave; no download is allowed,
    and linkage with genomic data is planned. Québec’s Law 25 treats remote access from outside Québec as a communication
    outside Québec.
  exporter: McGill University / Montreal Neurological Institute (public body under Québec’s access and privacy legislation;
    REB under TCPS2).
  importer: Institut du Cerveau (ICM), Paris (controller under GDPR; CNIL reference methodology MR-004).
  datadesc: 7T structural and diffusion MRI (defaced), genome-wide variant calls, clinical phenotypes for a neurodegeneration
