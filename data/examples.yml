  importer: Charité – Universitätsmedizin Berlin (controller under GDPR; Art. 9(2)(j) research basis; Berlin data-protection
    law for hospitals).
  datadesc: Intracranial EEG (sEEG/ECoG) with electrode coordinates, seizure-onset annotations with shifted timestamps,
    age band, sex and surgical outcome; no names, dates or device serials.
  data: Intracranial EEG, HIPAA de-identified
  origin: United States (HIPAA; Common Rule)
  dest: Germany (GDPR)
  access: Downloadable copy
  tools:
