  - TCPS2 Chapter 5 (privacy) and Chapter 9 where Indigenous participants are involved.
  counsel:
  - Would a de-identified Limited-Data-Set-style extract serve the company’s stated purpose?
  - How are commercial benefit, IP and future resale handled if a redesigned research agreement is executed?
- id: s15
  short: Dutch lab → public model hub (leakage)
  region: Europe → public release
  title: Dutch lab wants to publish a generative EEG model whose leakage tests fail — not in current form
  setting: A Dutch university lab trained a generative model on 3,000 clinical EEG recordings to produce synthetic
    seizures for teaching and benchmarking, and wants to publish the weights on a public model hub. Membership-inference
    and extraction tests show that the model reproduces near-verbatim segments of training recordings for rare seizure
    types, so the Tool 3 release gate fails.
  exporter: Dutch university hospital lab (controller under GDPR/UAVG; Art. 9(2)(j) basis for training; METC approval).
  importer: The public, via a commercial model-hosting platform (no recipient-specific control; worldwide download).
  datadesc: Generative model weights (diffusion architecture) trained on 3,000 pseudonymised clinical EEG recordings
    with seizure labels; synthetic outputs; development checkpoints and training logs.
  data: Generative model weights trained on clinical EEG
  origin: Netherlands (GDPR; UAVG)
  dest: Public release (model hub)
  access: Public download
  tools:
  - tool: Tool 1
    result: Tier 5, provisional.
    steps:
    - step: 2A
      answer: 'Yes'
      note: The object is a model → candidate Tier 5; Tool 3 required.
    - step: 2B
      answer: 'Yes'
      note: Reasonable possibility of persistence → provisional Tier 5.
  - tool: Tool 3
    result: 'Outcome 5 — Do not proceed in the current form. Confirm Tier 5. Redesign: retrain with the rare-type
      records excluded and differential-privacy training, re-test; or gated access with query limits instead of
      weight release.'
    steps:
    - step: '1'
      answer: 'Yes'
      note: Model training and public release.
    - step: '3'
      answer: 'Yes'
      note: Weights circulate independently.
    - step: '4'
      answer: 'Yes'
      note: Extraction tests reproduce near-verbatim training segments for rare seizure types.
    - step: '6'
      answer: 'Yes'
      note: Computational persistence confirmed.
    - step: '7'
      answer: Tested — material exposure identified
      note: Membership inference above threshold; extraction of recognisable segments. Public release not supported.
    - step: '10'
      answer: Partly
      note: Unlearning not reliable for the affected records; retraining without rare-type records proposed.
    - step: '11'
      answer: 'No'
      note: Exposure cannot be managed for a public release.
  - tool: Tool 2
    result: Outcome 3 — Redesign (gated access) or wait for a re-tested model.
    steps:
    - step: '3'
      answer: Public release
      note: 'Not permitted: Tool 3 Step 7 records material exposure. Outcome 3 (redesign to gated access) recorded
        for the current weights.'
  - tool: Tool 4
    result: Agreement only for the gated-access alternative.
    steps:
    - step: '6'
      answer: AI and model governance
      note: For the gated alternative.
    - step: '16'
      answer: Persistent artefacts
      note: Checkpoint retirement; re-test before any future release.
  verdict_new: Do not proceed in current form (retrain or gate)
  legal:
  - 'EDPB Opinion 28/2024: a model is anonymous only if extraction of personal data and extraction through queries
    are both unlikely by means reasonably likely to be used; documented testing required.'
  - GDPR Art. 9 continues to apply to a model from which health data can be extracted; public release would be an
    unlawful disclosure.
  - Dutch UAVG art. 24 (scientific research exception) covers training, not public dissemination of extractable
    data.
  counsel:
  - Which leakage thresholds and attack models does the lab’s data-protection officer accept as the anonymity standard?
  - Does the METC approval cover synthetic-data generation and release, or only internal benchmarking?
